<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chem-units · playground</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0; }
      h1 small { font-size: 0.5em; font-weight: 400; opacity: 0.6; }
      .hint { opacity: 0.6; margin-top: 0.25rem; }
      .grid {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 0.75rem;
        align-items: end;
        margin: 1.5rem 0 0.5rem;
      }
      label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.2rem; }
      select, input {
        width: 100%;
        padding: 0.5rem;
        font-size: 1rem;
        box-sizing: border-box;
      }
      .row { display: flex; gap: 0.75rem; margin-top: 1rem; align-items: end; }
      .row > div { flex: 1; }
      button {
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        cursor: pointer;
        height: fit-content;
      }
      #result {
        margin-top: 1.5rem;
        padding: 1rem;
        border: 1px solid currentColor;
        border-radius: 8px;
        font-size: 1.25rem;
        font-variant-numeric: tabular-nums;
      }
      #formula {
        margin-top: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        opacity: 0.65;
        word-break: break-all;
      }
    </style>
    <script type="module" crossorigin src="/chem-units/assets/index-BpEb05yt.js"></script>
  </head>
  <body>
    <h1>chem-units <small id="version"></small></h1>
    <p class="hint">Dev playground — imports live source via <code>@src</code>. Not part of the build or published package.</p>

    <div>
      <label for="field">Field</label>
      <select id="field"></select>
    </div>

    <div class="grid">
      <div>
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <button id="swap" title="Swap from/to">⇄</button>
      <div>
        <label for="to">To</label>
        <select id="to"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="value">Value</label>
        <input id="value" type="number" step="any" value="1" />
      </div>
      <div style="max-width: 120px">
        <label for="precision">Precision</label>
        <input id="precision" type="number" min="0" max="15" value="5" />
      </div>
    </div>

    <div id="result">—</div>
    <div id="formula"></div>

  </body>
</html>
